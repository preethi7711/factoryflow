# Runs on every push and pull request: lint, then the full test suite on a real Postgres 16.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factoryflow
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: factoryflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factoryflow"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      # CI-only throwaway values; nothing here is a real secret.
      DATABASE_URL: postgresql+psycopg://factoryflow:ci-only@localhost:5432/factoryflow
      TEST_DATABASE_URL: postgresql+psycopg://factoryflow:ci-only@localhost:5432/factoryflow_test
      JWT_SECRET_KEY: ci-only-not-secret
      SEED_DEMO_PASSWORD: ci-only

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (benchmark checks show as xfail until built)
        run: pytest -v
