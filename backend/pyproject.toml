# Tool configuration only. Dependencies live in requirements*.txt.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) would otherwise make ruff treat the library as ours.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
xfail_strict = true
markers = [
  "benchmark: the PROBLEM.md section 5 scenario (run with -m benchmark)",
]
